spring.application.name=unimanage-ai

# MySQL Database Config
spring.datasource.url=jdbc:mysql://localhost:3306/unimanage_ai?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=root123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# Server Port - 8081 ku maathiten da, 8080 conflict varakoodathu nu
server.port=8081

# Logs
logging.level.org.hibernate.SQL=DEBUG
logging.level.com.unimanage=DEBUG